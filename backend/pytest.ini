[pytest]
asyncio_mode = auto

# One event loop for the whole session, for both fixtures and tests.
#
# The database client is connected once by the autouse fixture in conftest.py and never
# reconnected. Under a per-function loop that connection belongs to whichever loop the
# first test happened to use, and every test after it raised "Future attached to a
# different loop" - which surfaced as a 500 from the route under test rather than as an
# error, so the suites that hit a database looked broken rather than misconfigured.
#
# The alternative - connecting and disconnecting per test - costs a full round trip to
# the database for every test in the suite, for no benefit: nothing here depends on a
# fresh connection.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
